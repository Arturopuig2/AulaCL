<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula CL - Comprensión Lectora</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Grand+Hotel&family=Fredoka:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=17">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <nav
        style="background: white; padding: 1rem; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10;">
        <div style="display: flex; align-items: center;">
            {% block navbar_logo %}
            <div style="margin-right: 1.5rem;">
                <img src="/static/images/logo_aula_abcd.png" alt="Aula CL" style="height: 40px;">
            </div>
            {% endblock %}
            {% block navbar_actions %}{% endblock %}
        </div>

        <!-- Header Text Removed -->
        <div id="dynamic-nav-title"
            style="position: absolute; left: 50%; transform: translateX(-50%); font-family: 'Fredoka', sans-serif; font-size: 1.2rem; font-weight: 500; color: #1e293b; pointer-events: none;">
            <!-- JS will populate this -->
        </div>

        <div id="nav-links">
            <!-- JS will populate this based on auth status -->
        </div>
    </nav>

    <div class="container" style="margin-top: 0.5rem;">
        {% block content %}{% endblock %}
    </div>


    <!-- Unlock Modal (Global) -->
    <div id="unlock-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
        <div class="glass-panel" onclick="event.stopPropagation()"
            style="background: white; padding: 2rem; max-width: 400px; width: 90%; border-radius: 30px; border: 3px solid #E2E8F0; font-family: 'Fredoka', sans-serif;">
            <h2
                style="margin-bottom: 1.2rem; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 1.8rem; letter-spacing: -1px; color: #1e293b; font-weight: 500;">
                🔓 Añadir Licencia</h2>
            <p
                style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary); font-family: 'Fredoka', sans-serif;">
                Introduce tu licencia
                para acceder a todas las lecturas durante 1 año.</p>
            <form id="unlock-form">
                <input type="text" id="unlock-code" placeholder="XXXXXXXXX" onfocus="this.placeholder=''"
                    onblur="this.placeholder='XXXXXXXXX'" required
                    style="width: 100%; padding: 0.8rem 1.2rem; border: 2px solid #E2E8F0; border-radius: 50px; margin-bottom: 1.5rem; text-align: center; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; font-family: 'Fredoka', sans-serif;">
                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
                    <button type="submit" class="btn-bubble"
                        style="background: #DCFCE7; color: #16A34A; border: 2px solid #86EFAC; padding: 0.5rem 1.8rem; border-radius: 50px; font-size: 1rem; font-family: 'Fredoka', sans-serif !important; cursor: pointer; transition: all 0.2s ease;">activar</button>
                    <button type="button" onclick="closeUnlockModal()" class="btn-bubble"
                        style="background: #FCE7F3; color: #DB2777; border: 2px solid #F9A8D4; padding: 0.5rem 1.8rem; border-radius: 50px; font-size: 1rem; font-family: 'Fredoka', sans-serif !important; cursor: pointer; transition: all 0.2s ease;">cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Password Modal (Global) -->
    <div id="change-password-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
        <div class="glass-panel" onclick="event.stopPropagation()"
            style="background: white; padding: 2.5rem; max-width: 400px; width: 90%; border-radius: 30px; border: 3px solid #E2E8F0; font-family: 'Fredoka', sans-serif;">
            <h2
                style="margin-bottom: 2rem; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 1.8rem; letter-spacing: -1px; color: #1e293b; font-weight: 500;">
                🔐 Cambiar Contraseña</h2>
            <form id="change-password-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <div style="position: relative;">
                        <input type="text" id="current-password" required placeholder="Contraseña Actual"
                            onfocus="this.placeholder=''" onblur="this.placeholder='Contraseña Actual'"
                            style="width: 100%; padding: 0.8rem 1.2rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif;">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <div style="position: relative;">
                        <input type="text" id="new-password" required placeholder="Nueva Contraseña"
                            onfocus="this.placeholder=''" onblur="this.placeholder='Nueva Contraseña'"
                            style="width: 100%; padding: 0.8rem 1.2rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif;">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <div style="position: relative;">
                        <input type="text" id="confirm-new-password" required placeholder="Confirmar Nueva"
                            onfocus="this.placeholder=''" onblur="this.placeholder='Confirmar Nueva'"
                            style="width: 100%; padding: 0.8rem 1.2rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif;">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <button type="submit" class="btn-bubble"
                        style="background: #DCFCE7; color: #16A34A; border: 2px solid #86EFAC; padding: 0.6rem 1.5rem; border-radius: 50px; font-size: 1rem; font-family: 'Fredoka', sans-serif !important; cursor: pointer; transition: all 0.2s ease;">guardar</button>
                    <button type="button" onclick="closeChangePasswordModal()" class="btn-bubble"
                        style="background: #FCE7F3; color: #DB2777; border: 2px solid #F9A8D4; padding: 0.6rem 1.5rem; border-radius: 50px; font-size: 1rem; font-family: 'Fredoka', sans-serif !important; cursor: pointer; transition: all 0.2s ease;">cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Token storage handling if needed (e.g. from Google Auth callback)
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            localStorage.setItem('token', tokenFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
    <script src="/static/js/app.js?v=14"></script>
</body>

</html>
