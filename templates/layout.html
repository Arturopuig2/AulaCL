<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula CL - Comprensión Lectora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Grand+Hotel&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=17">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <nav
        style="background: white; padding: 1rem; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10;">
        <div style="display: flex; align-items: center;">
            <div style="margin-right: 1.5rem;">
                <img src="/static/images/logo_aula_abcd.png" alt="Aula CL" style="height: 40px;">
            </div>
            {% block navbar_actions %}{% endblock %}
        </div>

        <!-- Header Text Removed -->
        <div id="nav-links">
            <!-- JS will populate this based on auth status -->
        </div>
    </nav>

    <div class="container" style="margin-top: 0.5rem;">
        {% block content %}{% endblock %}
    </div>


    <!-- Unlock Modal (Global) -->
    <div id="unlock-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
        <div class="glass-panel" onclick="event.stopPropagation()"
            style="background: white; padding: 2rem; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h2 style="margin-bottom: 1rem; text-align: center;">🔓 Desbloquear Todo</h2>
            <p style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary);">Introduce tu licencia
                para acceder a todas las lecturas durante 1 año.</p>
            <form id="unlock-form">
                <input type="text" id="unlock-code" placeholder="XXXXXXXXX" onfocus="this.placeholder=''"
                    onblur="this.placeholder='XXXXXXXXX'" required
                    style="width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; margin-bottom: 1rem; text-align: center; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase;">
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-bottom: 0.5rem;">Activar</button>
                <button type="button" onclick="closeUnlockModal()" class="btn btn-outline"
                    style="width: 100%;">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Change Password Modal (Global) -->
    <div id="change-password-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
        <div class="glass-panel" onclick="event.stopPropagation()"
            style="background: white; padding: 2rem; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h2 style="margin-bottom: 1rem; text-align: center;">🔐 Cambiar Contraseña</h2>
            <form id="change-password-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.9rem;">Contraseña Actual</label>
                    <input type="password" id="current-password" required
                        style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.9rem;">Nueva Contraseña</label>
                    <input type="password" id="new-password" required
                        style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="font-size: 0.9rem;">Confirmar Nueva</label>
                    <input type="password" id="confirm-new-password" required
                        style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 0.5rem;">Guardar
                    Cambios</button>
                <button type="button" onclick="closeChangePasswordModal()" class="btn btn-outline"
                    style="width: 100%;">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js?v=14"></script>
</body>

</html>
