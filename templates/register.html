{% extends "layout.html" %}

{% block navbar %}{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding-top: 1.5rem; font-family: 'Fredoka', sans-serif;">
    <div class="glass-panel"
        style="padding: 1.2rem; border-radius: 30px; border: 3px solid #E2E8F0; background: white;">
        <h2
            style="text-align: center; font-family: 'Fredoka', sans-serif; margin-bottom: 1.2rem; font-size: 1.8rem; letter-spacing: -1px; color: #1e293b; font-weight: 500;">
            Registro</h2>
        <form id="register-form">
            <div class="form-group" style="margin-bottom: 0.8rem;">
                <input type="text" id="name" required placeholder="Nombre" onfocus="this.placeholder=''"
                    onblur="this.placeholder='Nombre'"
                    style="width: 100%; padding: 0.6rem 1rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif; font-size: 0.9rem;">
            </div>
            <div class="form-group" style="margin-bottom: 0.8rem;">
                <input type="email" id="email" required placeholder="Correo Electrónico" onfocus="this.placeholder=''"
                    onblur="this.placeholder='Correo Electrónico'"
                    style="width: 100%; padding: 0.6rem 1rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif; font-size: 0.9rem;">
            </div>
            <div class="form-group" style="margin-bottom: 0.8rem;">
                <input type="email" id="confirm_email" required placeholder="Repetir Correo Electrónico"
                    onfocus="this.placeholder=''" onblur="this.placeholder='Repetir Correo Electrónico'"
                    style="width: 100%; padding: 0.6rem 1rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif; font-size: 0.9rem;">
            </div>

            <div class="form-group" style="margin-bottom: 0.8rem;">
                <div style="position: relative;">
                    <input type="text" id="password" required placeholder="Contraseña" onfocus="this.placeholder=''"
                        onblur="this.placeholder='Contraseña'"
                        style="width: 100%; padding: 0.6rem 1rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif; font-size: 0.9rem;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.2rem;">
                <div style="position: relative;">
                    <input type="text" id="confirm_password" required placeholder="Repetir Contraseña"
                        onfocus="this.placeholder=''" onblur="this.placeholder='Repetir Contraseña'"
                        style="width: 100%; padding: 0.6rem 1rem; border: 2px solid #E2E8F0; border-radius: 50px; font-family: 'Fredoka', sans-serif; font-size: 0.9rem;">
                </div>
            </div>

            <div class="form-group"
                style="margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.8rem; padding: 0 0.5rem;">
                <input type="checkbox" id="is_teacher"
                    style="width: 20px; height: 20px; cursor: pointer; accent-color: #10b981;">
                <label for="is_teacher"
                    style="font-size: 0.95rem; color: #475569; cursor: pointer; user-select: none;">Soy
                    profesor/a</label>
            </div>




            <button type="submit" class="btn-bubble btn-bubble-green"
                style="width: 100%; padding: 0.6rem; font-size: 1rem;">Registrarse</button>
        </form>
        <p style="margin-top: 1.2rem; text-align: center; font-size: 0.85rem; font-family: 'Fredoka';">
            ¿Ya tienes cuenta? <a href="/login" style="color: #2563eb; font-weight: 600; text-decoration: none;">Inicia
                Sesión</a>
        </p>
    </div>
</div>

<script>

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const confirmEmail = document.getElementById('confirm_email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const isTeacher = document.getElementById('is_teacher').checked;


        // Regex Validations
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$/;

        if (!emailRegex.test(email)) {
            alert('Por favor, introduce un correo electrónico válido.');
            return;
        }

        if (!passwordRegex.test(password)) {
            alert('La contraseña debe tener al menos 8 caracteres y contener letras y números.');
            return;
        }

        if (email !== confirmEmail) {
            alert('Los correos electrónicos no coinciden.');
            return;
        }

        if (password !== confirmPassword) {
            alert('Las contraseñas no coinciden. Por favor verifícalas.');
            return;
        }


        try {
            await axios.post('/auth/register', {
                username: email,
                name: name,
                email: email,
                password: password,
                is_teacher: isTeacher
            });

            // 2. Auto-Login
            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);

            const loginResponse = await axios.post('/auth/token', formData);
            const token = loginResponse.data.access_token;

            // 3. Store Token and Redirect
            localStorage.setItem('token', token);
            localStorage.setItem('username', email);
            localStorage.setItem('is_subuser', 'false');

            // Set Cookie for server-side auth (30 days)
            document.cookie = `access_token=${token}; path=/; max-age=${60 * 60 * 24 * 30}; SameSite=Lax`;

            window.location.href = '/dashboard';

        } catch (error) {
            console.error(error);
            alert('Error de registro/login: ' + (error.response?.data?.detail || error.message));
        }
    });
</script>
{% endblock %}
