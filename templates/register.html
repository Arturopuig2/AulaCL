{% extends "layout.html" %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding-top: 1rem;">
    <div class="glass-panel" style="padding: 2rem;">
        <h2 style="text-align: center;">Registro</h2>
        <form id="register-form">
            <div class="form-group">
                <input type="text" id="name" required placeholder="Nombre" onfocus="this.placeholder=''"
                    onblur="this.placeholder='Nombre'">
            </div>
            <div class="form-group">
                <input type="email" id="email" required placeholder="Correo Electrónico" onfocus="this.placeholder=''"
                    onblur="this.placeholder='Correo Electrónico'">
            </div>
            <div class="form-group">
                <input type="email" id="confirm_email" required placeholder="Repetir Correo Electrónico"
                    onfocus="this.placeholder=''" onblur="this.placeholder='Repetir Correo Electrónico'">
            </div>

            <div class="form-group">
                <div style="position: relative;">
                    <input type="text" id="password" required style="width: 100%; padding-right: 0.5rem;"
                        placeholder="Contraseña" onfocus="this.placeholder=''" onblur="this.placeholder='Contraseña'">
                </div>
            </div>

            <div class="form-group">
                <div style="position: relative;">
                    <input type="text" id="confirm_password" required style="width: 100%; padding-right: 0.5rem;"
                        placeholder="Repetir Contraseña" onfocus="this.placeholder=''"
                        onblur="this.placeholder='Repetir Contraseña'">
                </div>
            </div>


            <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
        </form>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
            ¿Ya tienes cuenta? <a href="/login" style="color: var(--primary-color);">Inicia Sesión</a>
        </p>
    </div>
</div>

<script>

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const confirmEmail = document.getElementById('confirm_email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;


        if (email !== confirmEmail) {
            alert('Los correos electrónicos no coinciden.');
            return;
        }

        if (password !== confirmPassword) {
            alert('Las contraseñas no coinciden. Por favor verifícalas.');
            return;
        }


        try {
            // 1. Register User (Send email as username)
            await axios.post('/auth/register', {
                username: email,
                name: name,
                email: email,
                password: password
            });

            // 2. Auto-Login
            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);

            const loginResponse = await axios.post('/auth/token', formData);

            // 3. Store Token and Redirect
            localStorage.setItem('token', loginResponse.data.access_token);
            localStorage.setItem('username', email);

            // alert('Registro exitoso. Redirigiendo...'); // Optional: removed for seamless experience
            window.location.href = '/dashboard';

        } catch (error) {
            console.error(error);
            alert('Error de registro/login: ' + (error.response?.data?.detail || error.message));
        }
    });
</script>
{% endblock %}
