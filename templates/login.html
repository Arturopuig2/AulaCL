{% extends "layout.html" %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding-top: 1rem;">
    <div class="glass-panel" style="padding: 2rem;">
        <h2 style="text-align: center;">Iniciar Sesión</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Correo Electrónico</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position: relative;">
                    <input type="text" id="password" required style="width: 100%; padding-right: 2.5rem;">
                    <span id="toggle-password"
                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem;">🐵</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>

            <div style="margin-top: 1rem; text-align: center;">
                <span style="color: #64748b; font-size: 0.9rem;">o</span>
            </div>

            <a href="/auth/google" class="btn btn-outline"
                style="width: 100%; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: #1e293b; border-color: #cbd5e1;">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"
                    style="width: 20px; height: 20px;">
                Entrar con Google
            </a>

        </form>
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; text-align: center;">
            <p style="margin-bottom: 0.5rem; font-weight: 500;">¿Eres estudiante?</p>
            <a href="/login-code" class="btn btn-outline" style="display: block; width: 100%; text-decoration: none;">
                Entrar con Código de Acceso
            </a>
        </div>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="/register" style="color: var(--primary-color);">Regístrate</a>
            <br>
            <a href="/forgot-password" style="font-size: 0.8rem; color: var(--text-secondary);">¿Olvidaste tu
                contraseña?</a>
        </p>
    </div>
</div>

<script>
    // CHECK FOR GOOGLE LOGIN TOKEN
    (function checkGoogleLogin() {
        const urlParams = new URLSearchParams(window.location.search);
        const googleToken = urlParams.get('google_token');
        const username = urlParams.get('username');

        if (googleToken && username) {
            localStorage.setItem('token', googleToken);
            localStorage.setItem('username', username);
            // Clear URL to hide token
            window.history.replaceState({}, document.title, "/login");
            // Redirect
            window.location.href = '/dashboard';
        }
    })();

    document.getElementById('toggle-password').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '🙈' : '🐵';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Form data for OAuth2
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);

        try {
            const response = await axios.post('/auth/token', formData);
            localStorage.setItem('token', response.data.access_token);
            localStorage.setItem('username', username);
            window.location.href = '/dashboard';
        } catch (error) {
            alert('Error de login: ' + (error.response?.data?.detail || error.message));
        }
    });
</script>
{% endblock %}
