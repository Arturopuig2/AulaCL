{% extends "layout.html" %}

{% block navbar_actions %}
<a href="/reading/admin" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">← Volver al
    Panel</a>
{% endblock %}

{% block content %}
<h1 style="max-width: 1000px; margin: 0 auto 2rem auto;">Subir Lectura</h1>

<div style="max-width: 1000px; margin: 0 auto;">

    <!-- UPLOAD FORM -->
    <div id="upload-form-container"
        style="margin-bottom: 3rem; background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e2e8f0;">
        <h2 style="margin-bottom: 1.5rem; color: #1e40af; font-size: 1.5rem;">Nueva Lectura</h2>
        <form id="upload-form" style="display: flex; flex-direction: column; gap: 1.5rem;">

            <!-- ROW 1: METADATA -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.5rem; align-items: end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new-title"
                        style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Título</label>
                    <input type="text" id="new-title" required
                        style="padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; width: 100%;">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new-course"
                        style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Curso</label>
                    <select id="new-course" required
                        style="padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; width: 100%;">
                        <option value="" disabled selected>Seleccionar...</option>
                        <optgroup label="Primaria">
                            <option value="1P">1º Primaria</option>
                            <option value="2P">2º Primaria</option>
                            <option value="3P">3º Primaria</option>
                            <option value="4P">4º Primaria</option>
                            <option value="5P">5º Primaria</option>
                            <option value="6P">6º Primaria</option>
                        </optgroup>
                        <option value="ALL">Sin Curso / General</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new-lang"
                        style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Idioma</label>
                    <select id="new-lang" required
                        style="padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; width: 100%;">
                        <option value="es" selected>Español</option>
                        <option value="val">Valencià</option>
                        <option value="en">Inglés</option>
                        <option value="fr">Francés</option>
                        <option value="cat">Català</option>
                        <option value="gal">Gallego</option>
                        <option value="eus">Euskera</option>
                    </select>
                </div>
            </div>

            <!-- ROW 2: FILES -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; align-items: end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Archivo de Texto
                        (.txt)</label>
                    <div style="position: relative; display: flex; align-items: center; gap: 1rem;">
                        <input type="file" id="text-file" accept=".txt" required style="display: none;"
                            onchange="document.getElementById('text-file-name').textContent = this.files[0]?.name || ''">
                        <button type="button" onclick="document.getElementById('text-file').click()"
                            style="background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; color: #475569; font-weight: 500;">
                            Seleccionar Archivo
                        </button>
                        <span id="text-file-name" style="color: #64748b; font-size: 0.9rem;"></span>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Audio (.mp3)
                        (Opcional)</label>
                    <div style="position: relative; display: flex; align-items: center; gap: 1rem;">
                        <input type="file" id="audio-file" accept=".mp3" style="display: none;"
                            onchange="document.getElementById('audio-file-name').textContent = this.files[0]?.name || ''">
                        <button type="button" onclick="document.getElementById('audio-file').click()"
                            style="background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; color: #475569; font-weight: 500;">
                            Seleccionar Audio
                        </button>
                        <span id="audio-file-name" style="color: #64748b; font-size: 0.9rem;"></span>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Imagen (Opcional)</label>
                    <div style="position: relative; display: flex; align-items: center; gap: 1rem;">
                        <input type="file" id="image-file" accept="image/*" style="display: none;"
                            onchange="document.getElementById('image-file-name').textContent = this.files[0]?.name || ''">
                        <button type="button" onclick="document.getElementById('image-file').click()"
                            style="background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; color: #475569; font-weight: 500;">
                            Seleccionar Imagen
                        </button>
                        <span id="image-file-name" style="color: #64748b; font-size: 0.9rem;"></span>
                    </div>
                </div>
            </div>

            <div style="grid-column: 1 / -1;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Subir y Analizar</button>
            </div>
        </form>
    </div>

    <!-- UPLOAD REVIEW EDITOR (Hidden by default) -->
    <div id="upload-review-editor"
        style="display: none; margin-bottom: 3rem; background: white; padding: 2rem; border-radius: 1rem; border: 1px solid #e2e8f0;">


        <h3 style="margin-bottom: 1rem; color: #1e40af;">Revisión</h3>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Por favor, revisa el texto y las preguntas generadas antes de
            guardar.</p>

        <style>
            .image-preview {
                width: 100%;
                max-height: 200px;
                object-fit: cover;
                border-radius: 0.5rem;
                margin-bottom: 1rem;
                display: none;
                border: 2px solid #e2e8f0;
            }
        </style>

        <div class="form-group" style="margin-bottom: 1rem;">
            <label style="font-weight: bold;">Título</label>
            <input type="text" id="review-title"
                style="width: 100%; padding: 0.5rem; font-weight: bold; font-size: 1.1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 100px; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Curso</label>
                <select id="review-course" class="form-control"
                    style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
                    <option value="" disabled>Seleccionar...</option>
                    <optgroup label="Primaria">
                        <option value="1P">1º Primaria</option>
                        <option value="2P">2º Primaria</option>
                        <option value="3P">3º Primaria</option>
                        <option value="4P">4º Primaria</option>
                        <option value="5P">5º Primaria</option>
                        <option value="6P">6º Primaria</option>
                    </optgroup>
                    <option value="ALL">Sin Curso / General</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Idioma</label>
                <select id="review-lang" class="form-control"
                    style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
                    <option value="es">Español</option>
                    <option value="en">Inglés</option>
                    <option value="val">Valencià</option>
                    <option value="cat">Català</option>
                    <option value="gal">Gallego</option>
                    <option value="eus">Euskera</option>
                    <option value="fr">Francés</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Nº Orden</label>
                <input type="number" id="review-order" class="form-control" min="0" max="99" value="0" 
                    style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
            <label style="font-weight: bold;">Contenido del Texto</label>
            <textarea id="review-content"
                style="width: 100%; height: 300px; padding: 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-family: sans-serif; line-height: 1.6; font-size: 14px;"></textarea>
        </div>

        <!-- ILLUSTRATION UPLOAD (MANUAL) -->
        <div class="form-group"
            style="margin-bottom: 2rem; background: #f8fafc; padding: 1rem; border-radius: 0.5rem; border: 1px dashed #cbd5e1;">
            <label style="font-weight: bold; color: #475569; display: block; margin-bottom: 0.5rem;">🖼️ Ilustración
                (Opcional)</label>

            <img id="upload-image-preview" class="image-preview" src="" alt="Vista previa">

            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <input type="file" id="image-upload-input" accept="image/*" style="display: none;"
                    onchange="handleImageUpload(this)">
                <button onclick="document.getElementById('image-upload-input').click()" class="btn btn-outline"
                    style="font-size: 0.9rem;">
                    📤 Subir Imagen
                </button>
                <span id="upload-status" style="font-size: 0.85rem; color: #64748b;">Ningún archivo seleccionado</span>
            </div>
        </div>

        <h4
            style="margin-bottom: 1rem; color: #1e40af; display: flex; justify-content: space-between; align-items: center;">
            <span>Editar Preguntas</span>
            <button onclick="regenerateQuestions()" id="btn-regen-questions" class="btn btn-outline"
                style="font-size: 0.9rem; border-color: #3b82f6; color: #3b82f6;">
                🔄 Regenerar Preguntas
            </button>
        </h4>

        <div id="questions-container" style="display: grid; gap: 1rem; margin-bottom: 2rem;">
            <!-- Questions rendered via JS -->
        </div>

        <button onclick="addQuestion()" class="btn btn-outline"
            style="width: 100%; margin-bottom: 2rem; border-color: #22c55e; color: #16a34a; border-style: dashed;">
            + Añadir Pregunta Manual
        </button>

        <div style="display: flex; gap: 1rem;">
            <button onclick="saveFinalUpload()" id="btn-final-save" class="btn btn-primary"
                style="flex: 2; padding: 1rem; font-size: 1.1rem;">💾 Guardar Definitivamente</button>
            <button onclick="cancelUploadReview()" class="btn btn-outline" style="flex: 1;">Cancelar</button>
        </div>
    </div>
</div>

<script>
    let currentUploadData = null;

    async function checkAuth() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token || username !== 'admin') {
            window.location.href = '/dashboard';
            return;
        }
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;
    }
    checkAuth();

    // --- UPLOAD & ANALYZE LOGIC ---

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = "Analizando...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('title', document.getElementById('new-title').value);
        formData.append('course_level', document.getElementById('new-course').value);
        formData.append('language', document.getElementById('new-lang').value);
        formData.append('text_file', document.getElementById('text-file').files[0]);

        const audioFile = document.getElementById('audio-file').files[0];
        if (audioFile) {
            formData.append('audio_file', audioFile);
        }

        const imageFile = document.getElementById('image-file').files[0];
        if (imageFile) {
            formData.append('image_file', imageFile);
        }

        try {
            const token = localStorage.getItem('token');
            const response = await axios.post('/reading/admin/upload/analyze', formData, {
                headers: {
                    'Content-Type': 'multipart/form-data',
                    'Authorization': 'Bearer ' + token
                }
            });

            currentUploadData = response.data;
            // image_path is now returned by backend, so use it if available, else null
            // currentUploadData.image_path = response.data.image_path || null; 

            showReviewUI(currentUploadData);

            document.getElementById('upload-form-container').style.display = 'none';
            document.getElementById('upload-review-editor').style.display = 'block';
            document.getElementById('upload-review-editor').scrollIntoView({ behavior: 'smooth' });

        } catch (error) {
            handleError(error, 'Error analizando lectura');
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });

    function showReviewUI(data) {
        document.getElementById('review-title').value = data.title;
        document.getElementById('review-course').value = data.course_level;
        document.getElementById('review-lang').value = data.language;
        document.getElementById('review-order').value = data.order || 0;
        document.getElementById('review-content').value = data.content;

        // Show Image Preview if exists
        const preview = document.getElementById('upload-image-preview');
        const status = document.getElementById('upload-status');
        if (data.image_path) {
            preview.src = data.image_path;
            preview.style.display = 'block';
            status.innerText = "Imagen subida ✅";
        } else {
            preview.style.display = 'none';
            preview.src = "";
            status.innerText = "Ningún archivo seleccionado";
        }

        renderQuestions(data.questions);
    }

    function renderQuestions(questions) {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.style.background = '#f8fafc';
            card.style.padding = '1rem';
            card.style.border = '1px solid #e2e8f0';
            card.style.borderRadius = '0.5rem';

            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <div style="font-weight: bold; color: #475569;">Pregunta ${index + 1}</div>
                    <button onclick="deleteQuestion(${index})" class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; color: #ef4444; border: 1px solid #ef4444; border-radius: 4px; background: transparent;">Eliminar</button>
                </div>
                <input type="text" class="q-input" value="${(q.question || "").replace(/"/g, '&quot;')}" style="width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; border: 1px solid #94a3b8; border-radius: 4px; color: #1e293b; background: #ffffff;">
                
                <div class="opts-container" style="display: grid; gap: 0.5rem; padding-left: 1rem;">
                    ${q.options.map((opt, optIndex) => `
                        <div style="display: flex; align-items: center; gap: 0.5rem; justify-content: space-between;">
                            <input type="text" class="q-opt-input" data-opt="${optIndex}" value="${(opt || "").replace(/"/g, '&quot;')}" 
                            placeholder="Opción..." style="flex: 1; padding: 0.5rem; border: 1px solid #94a3b8; border-radius: 4px; color: #1e293b; background: #ffffff; min-width: 0; margin-right: 0.5rem;">
                            <input type="radio" name="q-correct-${index}" value="${optIndex}" ${q.correct_index === optIndex ? 'checked' : ''} style="width: 24px; height: 24px; flex-shrink: 0; cursor: pointer;">
                            <button onclick="removeOption(${index}, ${optIndex})" style="padding: 0 0.4rem; font-size: 1rem; line-height: 1; color: #94a3b8; border: none; background: transparent; cursor: pointer; flex-shrink: 0;" title="Eliminar opción">×</button>
                        </div>
                    `).join('')}
                </div>
                <button onclick="addOption(${index})" style="margin-top: 0.5rem; margin-left: 1rem; padding: 0.2rem 0.7rem; font-size: 0.8rem; border: 1px dashed #22c55e; color: #16a34a; background: transparent; border-radius: 4px; cursor: pointer;">+ Opción</button>
                <!-- Category Select -->
                <div style="margin-top: 0.5rem; text-align: right;">
                    <label style="font-size: 0.8rem; color: #64748b; margin-right: 0.5rem;">Tipo:</label>
                    <select class="q-category" style="padding: 0.2rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.8rem; background: white;">
                        <option value="LITERAL" ${q.category === 'LITERAL' ? 'selected' : ''}>LITERAL (Comprensión)</option>
                        <option value="INFERENCIAL" ${q.category === 'INFERENCIAL' ? 'selected' : ''}>INFERENCIAL (Deducción)</option>
                        <option value="VOCABULARIO" ${q.category === 'VOCABULARIO' ? 'selected' : ''}>VOCABULARIO (Léxico)</option>
                        <option value="DECODIFICACION" ${q.category === 'DECODIFICACION' ? 'selected' : ''}>DECODIFICACIÓN (Sonido-Letra)</option>
                        <option value="ORDERING" ${q.category === 'ORDERING' ? 'selected' : ''}>ORDENACIÓN (Drag &amp; Drop)</option>
                        <option value="REFLEXIVA" ${q.category === 'REFLEXIVA' ? 'selected' : ''}>REFLEXIVA (Valores)</option>
                        <option value="LUDICA" ${q.category === 'LUDICA' || q.category === 'LÚDICA' ? 'selected' : ''}>LÚDICA (Juego/Creatividad)</option>
                        <option value="ESCRITA" ${q.category === 'ESCRITA' ? 'selected' : ''}>EXPRESIÓN ESCRITA</option>
                        <option value="ORAL" ${q.category === 'ORAL' ? 'selected' : ''}>EXPRESIÓN ORAL</option>
                    </select>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function deleteQuestion(index) {
        if (!confirm("¿Eliminar pregunta?")) return;
        syncCurrentState();
        currentUploadData.questions.splice(index, 1);
        renderQuestions(currentUploadData.questions);
    }

    function addQuestion() {
        syncCurrentState();
        currentUploadData.questions.push({
            question: "Nueva pregunta...",
            options: ["Opción A", "Opción B", "Opción C"],
            correct_index: 0,
            category: "LITERAL"
        });
        renderQuestions(currentUploadData.questions);
    }

    function addOption(qIndex) {
        syncCurrentState();
        currentUploadData.questions[qIndex].options.push("");
        renderQuestions(currentUploadData.questions);
        setTimeout(() => {
            const cards = document.querySelectorAll('#questions-container > div');
            if (cards[qIndex]) {
                const inputs = cards[qIndex].querySelectorAll('.q-opt-input');
                if (inputs.length) inputs[inputs.length - 1].focus();
            }
        }, 50);
    }

    function removeOption(qIndex, optIndex) {
        syncCurrentState();
        const q = currentUploadData.questions[qIndex];
        if (q.options.length <= 2) { alert('Se necesitan al menos 2 opciones.'); return; }
        q.options.splice(optIndex, 1);
        if (q.correct_index >= q.options.length) q.correct_index = q.options.length - 1;
        renderQuestions(currentUploadData.questions);
    }

    function syncCurrentState() {
        currentUploadData.title = document.getElementById('review-title').value;
        currentUploadData.course_level = document.getElementById('review-course').value;
        currentUploadData.language = document.getElementById('review-lang').value;
        currentUploadData.order = parseInt(document.getElementById('review-order').value) || 0;
        currentUploadData.content = document.getElementById('review-content').value;

        const container = document.getElementById('questions-container');
        const newQuestions = [];

        for (let i = 0; i < container.children.length; i++) {
            const card = container.children[i];
            const qText = card.querySelector('.q-input').value;
            const optInputs = card.querySelectorAll('.q-opt-input');
            const checked = card.querySelector(`input[name="q-correct-${i}"]:checked`);
            const originalCorrectIndex = checked ? parseInt(checked.value) : 0;

            // Get text of selected correct option BEFORE filtering
            const selectedCorrectText = optInputs[originalCorrectIndex] ? optInputs[originalCorrectIndex].value.trim() : "";

            // Filter options
            const filteredOptions = Array.from(optInputs)
                .map(input => input.value.trim())
                .filter(val => val !== "");

            // Find NEW correct index
            let newCorrectIndex = filteredOptions.indexOf(selectedCorrectText);
            if (newCorrectIndex === -1 && filteredOptions.length > 0) {
                newCorrectIndex = 0;
            }

            const category = card.querySelector('.q-category').value; // Retrieve category

            newQuestions.push({
                question: qText,
                options: filteredOptions,
                correct_index: newCorrectIndex,
                category: category
            });
        }
        currentUploadData.questions = newQuestions;
    }

    async function saveFinalUpload() {
        syncCurrentState();
        const btn = document.getElementById('btn-final-save');
        btn.innerText = "Guardando...";
        btn.disabled = true;

        try {
            const payload = {
                title: currentUploadData.title,
                content: currentUploadData.content,
                course_level: currentUploadData.course_level,
                language: currentUploadData.language,
                questions: currentUploadData.questions,
                audio_path: currentUploadData.audio_path,
                image_path: currentUploadData.image_path,
                order: currentUploadData.order
            };

            const token = localStorage.getItem('token');
            await axios.post('/reading/admin/magic/save', payload, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            alert("¡Lectura guardada y publicada! 🎉");
            window.location.href = '/reading/admin/readings'; // Redirect to list

        } catch (error) {
            handleError(error, "Error guardando");
            btn.innerText = "💾 Guardar Definitivamente";
            btn.disabled = false;
        }
    }

    async function regenerateQuestions() {
        syncCurrentState();
        const content = currentUploadData.content;
        if (!content || content.length < 50) return alert("Texto muy corto");

        const btn = document.getElementById('btn-regen-questions');
        btn.innerText = "Pensando...";
        btn.disabled = true;

        try {
            const token = localStorage.getItem('token');
            const res = await axios.post('/reading/admin/magic/questions', { content: content }, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            // Filter out empty options from AI response
            const cleanedQuestions = res.data.questions.map(q => {
                const correctOptionText = q.options[q.correct_index] || "";
                const filteredOptions = q.options.filter(opt => opt && opt.trim() !== "");
                let newCorrectIndex = filteredOptions.indexOf(correctOptionText);
                if (newCorrectIndex === -1 && filteredOptions.length > 0) newCorrectIndex = 0;

                return {
                    ...q,
                    options: filteredOptions,
                    correct_index: newCorrectIndex
                };
            });
            currentUploadData.questions = cleanedQuestions;
            renderQuestions(currentUploadData.questions);
        } catch (e) {
            alert("Error: " + e.message);
        } finally {
            btn.innerText = "🔄 Regenerar Preguntas";
            btn.disabled = false;
        }
    }

    function cancelUploadReview() {
        document.getElementById('upload-review-editor').style.display = 'none';
        document.getElementById('upload-form-container').style.display = 'block';
        document.getElementById('upload-form').reset();
        currentUploadData = null;
    }

    function handleError(error, contextMsg) {
        console.error(error);
        if (error.response && error.response.status === 401) {
            alert("Tu sesión ha expirado. Por favor, inicia sesión de nuevo.");
            window.location.href = '/login';
            return;
        }
        alert(contextMsg + ": " + (error.response?.data?.detail || error.message));
    }

    async function handleImageUpload(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('upload-status').innerText = "Subiendo...";

            try {
                const token = localStorage.getItem('token');
                const response = await axios.post('/reading/admin/upload-image', formData, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                const imagePath = response.data.path; // Already has leading slash from backend

                // Update State
                currentUploadData.image_path = imagePath;

                // Update UI
                const preview = document.getElementById('upload-image-preview');
                preview.src = imagePath;
                preview.style.display = 'block';
                document.getElementById('upload-status').innerText = "Imagen subida ✅";

            } catch (error) {
                console.error(error);
                alert("Error subiendo imagen: " + (error.response?.data?.detail || error.message));
                document.getElementById('upload-status').innerText = "Error ❌";
            }
        }
    }
</script>
{% endblock %}
