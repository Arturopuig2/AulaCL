{% extends "layout.html" %}

{% block navbar_actions %}
<a href="/reading/admin" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">← Volver al
    Panel</a>
{% endblock %}

{% block content %}
<h1 style="max-width: 1000px; margin: 0 auto 2rem auto;">Gestión de Licencias de Alumnos</h1>

<div style="max-width: 1000px; margin: 0 auto;">
    <div
        style="margin-bottom: 3rem; background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e2e8f0;">

        <div style="display: flex; gap: 1rem; align-items: end; margin-bottom: 1.5rem;">
            <div style="flex: 1;">
                <label for="code-count" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Cantidad a
                    generar</label>
                <input type="number" id="code-count" value="1" min="1" max="50"
                    style="padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; width: 100%;">
            </div>
            <button onclick="generateCodes()" class="btn btn-primary" style="padding: 0.6rem 1.5rem;">Generar
                Licencias</button>
        </div>

        <h3 style="margin-bottom: 1rem; font-size: 1rem;">Licencias Existentes</h3>
        <div style="max-height: 400px; overflow-y: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                <thead style="position: sticky; top: 0; background: white;">
                    <tr style="border-bottom: 1px solid #e2e8f0; text-align: left;">
                        <th style="padding: 0.5rem;">Clave de Licencia</th>
                        <th style="padding: 0.5rem;">Estado</th>
                <thead style="position: sticky; top: 0; background: white;">
                    <tr style="border-bottom: 1px solid #e2e8f0; text-align: left;">
                        <th style="padding: 0.5rem;">Clave de Licencia</th>
                        <th style="padding: 0.5rem;">Estado</th>
                        <th style="padding: 0.5rem;">Usado Por (Alumno)</th>
                        <th style="padding: 0.5rem;">Email Tutor</th>
                        <th style="padding: 0.5rem;">Activada</th>
                        <th style="padding: 0.5rem;">Caduca</th>
                        <th style="padding: 0.5rem;">Quedan</th>
                        <th style="padding: 0.5rem;">Duración</th>
                    </tr>
                </thead>
                <tbody id="codes-table-body">
                    <!-- Codes loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function checkAuth() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token || username !== 'admin') {
            window.location.href = '/dashboard';
            return;
        }
        
        // Ensure Axios has the token
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;
        await loadCodes();
    }

    async function loadCodes() {
        const tbody = document.getElementById('codes-table-body');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem;">Cargando...</td></tr>';
        
        try {
            const response = await axios.get('/auth/admin/licenses');
            tbody.innerHTML = '';

            if (!response.data || response.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: #64748b;">No hay licencias generadas aún.</td></tr>';
                return;
            }

            // Sort: ACTIVE first, then by creation date
            const codes = response.data.sort((a, b) => {
                if (a.status === b.status) return 0;
                return a.status === 'ACTIVE' ? -1 : 1;
            });

            const now = new Date();

            codes.forEach(c => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #f1f5f9';
                
                // Formateo de fechas a es-ES (dd/mm/aaaa)
                const formatDate = (dateStr) => {
                    if (!dateStr) return '<span style="color: #cbd5e1;">-</span>';
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                };

                // Cálculo de días restantes
                let daysLeftHtml = '<span style="color: #cbd5e1;">-</span>';
                if (c.expires_at && c.status === 'USED') {
                    const expiry = new Date(c.expires_at);
                    const diffTime = expiry - now;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays <= 0) {
                        daysLeftHtml = '<span style="color: #ef4444; font-weight: 700;">Expirada</span>';
                    } else if (diffDays <= 30) {
                        daysLeftHtml = `<span style="color: #f97316; font-weight: 700;">${diffDays} d</span>`;
                    } else {
                        daysLeftHtml = `<span style="color: #1e293b;">${diffDays} d</span>`;
                    }
                }

                tr.innerHTML = `
                    <td style="padding: 0.8rem 0.5rem; font-family: monospace; font-weight: 600; color: #1e40af;">${c.key}</td>
                    <td style="padding: 0.8rem 0.5rem;">
                        ${c.status === 'USED'
                        ? '<span style="color: #ef4444; font-size: 0.75rem; background: #fee2e2; padding: 3px 8px; border-radius: 50px; font-weight: 600;">Usada</span>'
                        : '<span style="color: #16a34a; font-size: 0.75rem; background: #dcfce7; padding: 3px 8px; border-radius: 50px; font-weight: 600;">Activa/Libre</span>'}
                        <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 2px;">${c.type || 'Fija'}</div>
                    </td>
                    <td style="padding: 0.8rem 0.5rem; color: #334155; font-weight: 500;">
                        ${c.used_by || '<span style="color: #cbd5e1;">-</span>'}
                    </td>
                    <td style="padding: 0.8rem 0.5rem; color: #64748b; font-size: 0.8rem;">
                        ${c.parent_email || '<span style="color: #cbd5e1;">-</span>'}
                    </td>
                    <td style="padding: 0.8rem 0.5rem; color: #64748b; font-size: 0.8rem;">
                        ${formatDate(c.activated_at)}
                    </td>
                    <td style="padding: 0.8rem 0.5rem; color: #1e293b; font-size: 0.8rem; font-weight: 600;">
                        ${formatDate(c.expires_at)}
                    </td>
                    <td style="padding: 0.8rem 0.5rem; font-size: 0.8rem;">
                        ${daysLeftHtml}
                    </td>
                    <td style="padding: 0.8rem 0.5rem; color: #64748b; font-size: 0.8rem;">
                        ${c.duration_days} días
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Error loading licenses", error);
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem; color: #ef4444;">Error al cargar las licencias: ${error.response?.data?.detail || error.message}</td></tr>`;
        }
    }

    async function generateCodes() {
        const count = document.getElementById('code-count').value;
        const btn = document.querySelector('button[onclick="generateCodes()"]');
        const originalText = btn.innerText;
        
        try {
            btn.innerText = "Generando...";
            btn.disabled = true;
            
            const response = await axios.post(`/auth/admin/licenses?count=${count}`);
            await loadCodes();

            // Auto-Download Text File
            const keys = response.data;
            const today = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
            let fileContent = keys.map(key => `Licencia- Aula CL: ${key}`).join("\n");
            fileContent += `\n\nGenerado el: ${today}`;

            const blob = new Blob([fileContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `licencias_estudiantes_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            alert(`¡${count} licencias generadas con éxito y descargadas!`);
        } catch (error) {
            console.error(error);
            alert('Error generando licencias: ' + (error.response?.data?.detail || error.message));
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    // Wait for everything to load
    document.addEventListener('DOMContentLoaded', checkAuth);
</script>
{% endblock %}
