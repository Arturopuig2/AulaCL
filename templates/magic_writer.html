{% extends "layout.html" %}

{% block navbar_actions %}
<a href="/reading/admin" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">← Volver al
    Panel</a>
{% endblock %}

{% block content %}
<h1 style="max-width: 1000px; margin: 0 auto 2rem auto;">Escritor Mágico IA</h1>

<div style="max-width: 1000px; margin: 0 auto;">

    <div
        style="margin-bottom: 3rem; background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">

        <!-- MAGIC CONFIG -->
        <style>
            .image-preview {
                width: 100%;
                max-height: 200px;
                object-fit: cover;
                border-radius: 0.5rem;
                margin-bottom: 1rem;
                display: none;
                border: 2px solid #e2e8f0;
            }
        </style>


        <div id="magic-config">
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <input type="text" id="magic-topic"
                    placeholder="Tema / Sinopsis (ej: Dos astronautas descubren una flor)" class="form-control">

                <select id="magic-course-select" class="form-control">
                    <option value="" disabled selected>Nivel / Curso</option>
                    <optgroup label="Primaria">
                        <option value="1P">1º Primaria</option>
                        <option value="2P">2º Primaria</option>
                        <option value="3P">3º Primaria</option>
                        <option value="4P">4º Primaria</option>
                        <option value="5P">5º Primaria</option>
                        <option value="6P">6º Primaria</option>
                    </optgroup>
                    <option value="ALL">Sin Curso / General</option>
                </select>

                <input type="number" id="magic-words" placeholder="Palabras aprox (ej: 100)" class="form-control"
                    value="100">

                <select id="magic-type" class="form-control">
                    <option value="story" selected>Cuento / Historia</option>
                    <option value="news">Noticia</option>
                    <option value="poem">Poesía</option>
                    <option value="recipe">Receta de Cocina</option>
                </select>

                <select id="magic-lang" class="form-control">
                    <option value="es">Español</option>
                    <option value="en">Inglés</option>
                    <option value="val">Valencià</option>
                    <option value="fr">Francés</option>
                </select>
            </div>

            <button onclick="generateMagicStory()" id="btn-magic-gen" class="btn btn-primary"
                style="width: 100%; height: 42px; background: #2563eb; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                🪄 Generar Cuento
            </button>
        </div>

        <!-- MAGIC EDITOR -->
        <div id="magic-editor"
            style="display: none; margin-top: 2rem; border-top: 2px dashed #bfdbfe; padding-top: 2rem;">
            <h3 style="margin-bottom: 1rem; color: #1e40af;">Revisión y Edición</h3>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label style="font-weight: bold;">Título</label>
                <input type="text" id="edit-title"
                    style="width: 100%; padding: 0.5rem; font-weight: bold; font-size: 1.1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label style="font-weight: bold;">Historia</label>
                <textarea id="edit-content"
                    style="width: 100%; height: 300px; padding: 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-family: sans-serif; line-height: 1.6; font-size: 14px;"></textarea>
            </div>


            <!-- ILLUSTRATION UPLOAD (MANUAL) -->
            <div class="form-group"
                style="margin-bottom: 2rem; background: #f8fafc; padding: 1rem; border-radius: 0.5rem; border: 1px dashed #cbd5e1;">
                <label style="font-weight: bold; color: #475569; display: block; margin-bottom: 0.5rem;">🖼️ Ilustración
                    (Opcional)</label>

                <img id="draft-image-preview" class="image-preview" src="" alt="Vista previa">

                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="file" id="image-upload-input" accept="image/*" style="display: none;"
                        onchange="handleImageUpload(this)">
                    <button onclick="document.getElementById('image-upload-input').click()" class="btn btn-outline"
                        style="font-size: 0.9rem;">
                        📤 Subir Imagen
                    </button>
                    <span id="upload-status" style="font-size: 0.85rem; color: #64748b;">Ningún archivo
                        seleccionado</span>
                </div>
            </div>

            <!-- STEP 1 VALIDATION ACTION -->
            <div id="step-1-actions" style="margin-bottom: 2rem;">
                <button onclick="showLoading('🧠 Validando contenido...'); validateAndGenerateQuestions()"
                    id="btn-validate" class="btn btn-primary"
                    style="width: 100%; padding: 1rem; font-size: 1.1rem; background: #16a34a; border-color: #16a34a;">
                    ✅ Validar Historia y Generar Preguntas
                </button>
            </div>

            <!-- STEP 2: QUESTIONS (Initially Hidden) -->
            <div id="magic-step-2" style="display: none; border-top: 1px solid #e2e8f0; padding-top: 2rem;">
                <h4
                    style="margin-bottom: 1rem; color: #1e40af; display: flex; justify-content: space-between; align-items: center;">
                    <span>Editar Preguntas</span>
                    <button onclick="generateMagicQuestions()" id="btn-regen-questions" class="btn btn-outline"
                        style="font-size: 0.9rem; border-color: #3b82f6; color: #3b82f6;">
                        🔄 Regenerar Preguntas
                    </button>
                </h4>
                <div id="questions-container" style="display: grid; gap: 1rem; margin-bottom: 2rem;">
                    <!-- JS will popualte this -->
                </div>

                <button onclick="addQuestion()" class="btn btn-outline"
                    style="width: 100%; margin-bottom: 2rem; border-color: #22c55e; color: #16a34a; border-style: dashed;">
                    + Añadir Pregunta Manual
                </button>

                <div style="display: flex; gap: 1rem;">
                    <button onclick="saveMagicStory()" id="btn-magic-save" class="btn btn-primary"
                        style="flex: 2; padding: 1rem; font-size: 1.1rem;">💾 Guardar en Librería</button>
                    <button onclick="cancelMagic()" class="btn btn-outline" style="flex: 1;">Cancelar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentMagicDraft = null;

    // Check Auth on Load
    (function checkAuth() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (!token || username !== 'admin') {
            window.location.href = '/dashboard';
            return;
        }
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;
    })();

    function showLoading(msg) {
        console.log("Showing loading with message:", msg);
        const overlay = document.getElementById('magic-loading');
        const msgEl = document.getElementById('loading-msg');
        if (overlay && msgEl) {
            msgEl.innerText = msg || "Cargando...";
            overlay.style.setProperty('display', 'flex', 'important');
        } else {
            console.error("Critical: Loading overlay elements not found in DOM!");
            // Failsafe: at least alert the user something is happening
            if (!msg) alert("Procesando, por favor espere...");
        }
    }

    function hideLoading() {
        console.log("Hiding loading overlay");
        const overlay = document.getElementById('magic-loading');
        if (overlay) {
            overlay.style.display = 'none';
        }
    }

    async function generateMagicStory() {
        const topic = document.getElementById('magic-topic').value;
        const course = document.getElementById('magic-course-select').value;
        const words = document.getElementById('magic-words').value;
        const lang = document.getElementById('magic-lang').value;
        const type = document.getElementById('magic-type').value;

        if (!topic) {
            alert("Por favor, rellena el tema.");
            return;
        }

        const btn = document.getElementById('btn-magic-gen');
        const originalText = btn.innerText;

        showLoading("✨ Escribiendo Historia... (Paso 1/2)\nEsto puede tardar unos segundos.");
        btn.disabled = true;

        try {
            // STEP 1: Generate Content Only
            const response = await axios.post('/reading/admin/magic/story', {
                topic: topic,
                course_level: course,
                word_count: parseInt(words),
                language: lang,
                text_type: type
            });

            currentMagicDraft = response.data; // now just {title, content}

            // Pre-fill empty questions for rendering logic if needed, or just init empty
            currentMagicDraft.questions = [];

            renderMagicEditor(currentMagicDraft);

            // UI Switch
            document.getElementById('magic-config').style.display = 'none';
            document.getElementById('magic-editor').style.display = 'block';

        } catch (error) {
            handleError(error, "Error generando cuento");
        } finally {
            hideLoading();
            btn.innerText = originalText;
            btn.disabled = false;
        }

    }

    function renderMagicEditor(draft) {
        console.log("Rendering Draft:", draft); // Debugging
        document.getElementById('edit-title').value = draft.title;
        document.getElementById('edit-content').value = draft.content;

        const qContainer = document.getElementById('questions-container');
        qContainer.innerHTML = '';

        draft.questions.forEach((q, index) => {
            renderQuestionCard(q, index);
        });
    }

    function renderQuestionCard(q, index) {
        const qContainer = document.getElementById('questions-container');
        const card = document.createElement('div');
        card.style.background = '#f8fafc';
        card.style.padding = '1rem';
        card.style.border = '1px solid #e2e8f0';
        card.style.borderRadius = '0.5rem';

        // Generate HTML structure (values set via JS below for safety)
        card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <div style="font-weight: bold; color: #475569;">Pregunta ${index + 1}</div>
                <button onclick="deleteQuestion(${index})" class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; color: #ef4444; border: 1px solid #ef4444; border-radius: 4px; background: transparent;">
                    Eliminar
                </button>
            </div>
            <input type="text" class="q-input" style="width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; border: 1px solid #94a3b8; border-radius: 4px; color: #1e293b; background: #ffffff;">
            
            <div style="display: grid; gap: 0.5rem; padding-left: 1rem;">
                ${q.options.map((_, optIndex) => `
                    <div style="display: flex; align-items: center; gap: 0.5rem; justify-content: space-between;">
                        <input type="text" class="q-opt-input" data-q="${index}" data-opt="${optIndex}" placeholder="Escribe una opción..." 
                            onfocus="this.dataset.ph=this.placeholder;this.placeholder=''" 
                            onblur="this.placeholder=this.dataset.ph"
                            style="flex: 1; padding: 0.5rem; border: 1px solid #94a3b8; border-radius: 4px; color: #1e293b; background: #ffffff; min-width: 0; margin-right: 0.5rem;">
                        <input type="radio" name="q-correct-${index}" value="${optIndex}" ${q.correct_index === optIndex ? 'checked' : ''} style="width: 24px; height: 24px; flex-shrink: 0; cursor: pointer;">
                    </div>
                `).join('')}
            </div>
            <!-- Category Select -->
            <div style="margin-top: 0.5rem; text-align: right;">
                <label style="font-size: 0.8rem; color: #64748b; margin-right: 0.5rem;">Tipo:</label>
                <select class="q-category" style="padding: 0.2rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.8rem; background: white;">
                    <option value="LITERAL" ${q.category === 'LITERAL' ? 'selected' : ''}>LITERAL (Comprensión)</option>
                    <option value="INFERENCIAL" ${q.category === 'INFERENCIAL' ? 'selected' : ''}>INFERENCIAL (Deducción)</option>
                    <option value="VOCABULARIO" ${q.category === 'VOCABULARIO' ? 'selected' : ''}>VOCABULARIO (Léxico)</option>
                    <option value="REFLEXIVA" ${q.category === 'REFLEXIVA' ? 'selected' : ''}>REFLEXIVA (Valores)</option>
                    <option value="LUDICA" ${q.category === 'LUDICA' || q.category === 'LÚDICA' ? 'selected' : ''}>LÚDICA (Juego/Creatividad)</option>
                    <option value="ESCRITA" ${q.category === 'ESCRITA' ? 'selected' : ''}>EXPRESIÓN ESCRITA</option>
                    <option value="ORAL" ${q.category === 'ORAL' ? 'selected' : ''}>EXPRESIÓN ORAL</option>
                </select>
            </div>
        `;

        // Set values safely via DOM properties (avoids all escaping issues)
        card.querySelector('.q-input').value = q.question;
        const optInputs = card.querySelectorAll('.q-opt-input');
        q.options.forEach((opt, i) => {
            const safeOpt = (opt === null || opt === undefined) ? "" : opt;
            if (optInputs[i]) optInputs[i].value = safeOpt;
        });

        qContainer.appendChild(card);
    }

    function deleteQuestion(index) {
        if (!confirm("¿Seguro que quieres eliminar esta pregunta?")) return;
        saveCurrentEditorStateToDraft(); // Save changes before re-render
        currentMagicDraft.questions.splice(index, 1);
        renderMagicEditor(currentMagicDraft);
    }

    function addQuestion() {
        saveCurrentEditorStateToDraft(); // Save changes before re-render
        currentMagicDraft.questions.push({
            question: "Nueva pregunta...",
            options: ["Opción A", "Opción B", "Opción C"],
            correct_index: 0,
            category: "LITERAL"
        });
        renderMagicEditor(currentMagicDraft);
    }

    // Helper to sync inputs back to state before re-rendering
    function saveCurrentEditorStateToDraft() {
        const qContainer = document.getElementById('questions-container');
        const updatedQuestions = [];

        for (let i = 0; i < qContainer.children.length; i++) {
            const card = qContainer.children[i];
            const qText = card.querySelector('.q-input').value;

            const optInputs = card.querySelectorAll('.q-opt-input');
            const options = Array.from(optInputs).map(input => input.value);

            const checkedRadio = card.querySelector(`input[name="q-correct-${i}"]:checked`);
            const correctIndex = checkedRadio ? parseInt(checkedRadio.value) : 0;

            const category = card.querySelector('.q-category').value;

            updatedQuestions.push({
                question: qText,
                options: options,
                correct_index: correctIndex,
                category: category // Preserve category
            });
        }

        currentMagicDraft.questions = updatedQuestions;
        // Don't forget title/content if needed, but questions is the main dynamic part here
        currentMagicDraft.title = document.getElementById('edit-title').value;
        currentMagicDraft.content = document.getElementById('edit-content').value;
    }

    async function generateMagicQuestions() {
        const content = document.getElementById('edit-content').value;
        const topic = document.getElementById('edit-title').value; // Optional context

        if (!content || content.length < 50) {
            alert("El texto es demasiado corto para generar preguntas.");
            return;
        }

        // Target whichever button is relevant
        const btnRegen = document.getElementById('btn-regen-questions');
        const btnValidate = document.getElementById('btn-validate');

        let btn = btnValidate;
        // If Regen button exists and is visible, use that one as the target for status
        if (btnRegen && btnRegen.offsetParent !== null) {
            btn = btnRegen;
        }

        const originalText = btn.innerText;

        showLoading("🧠 Validando contenido y generando preguntas...\nEstamos analizando tu texto para crear las mejores preguntas posibles.");
        btn.disabled = true;

        try {
            const response = await axios.post('/reading/admin/magic/questions', {
                content: content,
                topic: topic
            });

            // Filter out empty options from AI response
            const cleanedQuestions = response.data.questions.map(q => {
                const correctOptionText = q.options[q.correct_index] || "";
                const filteredOptions = q.options.filter(opt => opt && opt.trim() !== "");
                let newCorrectIndex = filteredOptions.indexOf(correctOptionText);
                if (newCorrectIndex === -1 && filteredOptions.length > 0) newCorrectIndex = 0;

                return {
                    ...q,
                    options: filteredOptions,
                    correct_index: newCorrectIndex
                };
            });

            // Replace questions but keep text (updated with user edits)
            currentMagicDraft.questions = cleanedQuestions;
            currentMagicDraft.title = topic;
            currentMagicDraft.content = content;

            renderMagicEditor(currentMagicDraft);

            // Show Step 2
            document.getElementById('magic-step-2').style.display = 'block';
            document.getElementById('step-1-actions').style.display = 'none';

        } catch (error) {
            handleError(error, "Error generando preguntas");
        } finally {
            hideLoading();
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    async function validateAndGenerateQuestions() {
        await generateMagicQuestions();
    }

    async function saveMagicStory() {
        if (!currentMagicDraft) return;

        const btn = document.getElementById('btn-magic-save');
        const originalText = btn.innerText;

        showLoading("💾 Guardando en la librería...");
        btn.disabled = true;

        try {
            // 1. Collect Data
            const title = document.getElementById('edit-title').value;
            const content = document.getElementById('edit-content').value;
            // Magic Page only has one course selector now
            const courseSelect = document.getElementById('magic-course-select');
            const course = courseSelect.value;
            const lang = document.getElementById('magic-lang').value;

            // 2. Reconstruct Questions
            const questions = [];
            const qContainer = document.getElementById('questions-container');

            for (let i = 0; i < qContainer.children.length; i++) {
                const card = qContainer.children[i];
                const qText = card.querySelector('.q-input').value;

                const optInputs = card.querySelectorAll('.q-opt-input');
                const checkedRadio = card.querySelector(`input[name="q-correct-${i}"]:checked`);
                const originalCorrectIndex = checkedRadio ? parseInt(checkedRadio.value) : 0;

                // Get the text of the selected correct option BEFORE filtering
                const selectedCorrectText = optInputs[originalCorrectIndex] ? optInputs[originalCorrectIndex].value.trim() : "";

                // Filter options
                const filteredOptions = Array.from(optInputs)
                    .map(input => input.value.trim())
                    .filter(val => val !== "");

                // Find the NEW correct index
                let newCorrectIndex = filteredOptions.indexOf(selectedCorrectText);
                if (newCorrectIndex === -1 && filteredOptions.length > 0) {
                    newCorrectIndex = 0; // Fallback to first option
                }

                const category = card.querySelector('.q-category').value;

                questions.push({
                    question: qText,
                    options: filteredOptions,
                    correct_index: newCorrectIndex,
                    category: category // Send category to API
                });
            }

            // 3. Send API
            await axios.post('/reading/admin/magic/save', {
                title: title,
                content: content,
                questions: questions,
                course_level: course,
                language: lang,
                image_path: currentMagicDraft.image_path || null // Send image path
            });

            alert("¡Cuento guardado correctamente! 📚");
            cancelMagic();
            // Optional: Redirect back to admin or stay here? 
            // Staying here is fine for generating another one.

        } catch (error) {
            handleError(error, "Error guardando");
        } finally {
            hideLoading();
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    async function handleImageUpload(input) {
        if (input.files && input.files[0]) {
            if (!currentMagicDraft) {
                alert("Debes generar un cuento primero.");
                return;
            }

            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('upload-status').innerText = "Subiendo...";

            try {
                const response = await axios.post('/reading/admin/upload-image', formData);
                const imagePath = response.data.path; // Backend already returns /static/images/uploads/...

                // Update State
                currentMagicDraft.image_path = imagePath;

                // Update UI
                const preview = document.getElementById('draft-image-preview');
                preview.src = imagePath;
                preview.style.display = 'block';
                document.getElementById('upload-status').innerText = "Imagen subida ✅";

            } catch (error) {
                console.error(error);
                alert("Error subiendo imagen");
                document.getElementById('upload-status').innerText = "Error ❌";
            }
        }
    }

    function cancelMagic() {
        document.getElementById('magic-config').style.display = 'block';
        document.getElementById('magic-editor').style.display = 'none';
        document.getElementById('magic-step-2').style.display = 'none'; // Hide step 2
        document.getElementById('step-1-actions').style.display = 'block'; // Show step 1

        currentMagicDraft = null;
        document.getElementById('edit-title').value = '';
        document.getElementById('edit-content').value = '';
        document.getElementById('questions-container').innerHTML = '';
        document.getElementById('magic-topic').value = ''; // Clean topic too

        // Reset Image UI
        document.getElementById('draft-image-preview').style.display = 'none';
        document.getElementById('draft-image-preview').src = '';
        document.getElementById('upload-status').innerText = "Ningún archivo seleccionado";
        document.getElementById('image-upload-input').value = '';
    }
    function handleError(error, contextMsg) {
        console.error(error);
        if (error.response && error.response.status === 401) {
            alert("Tu sesión ha expirado. Por favor, inicia sesión de nuevo.");
            window.location.href = '/login';
            return;
        }
        alert(contextMsg + ": " + (error.response?.data?.detail || error.message));
    }
</script>
{% endblock %}
